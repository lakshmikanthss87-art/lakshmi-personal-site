<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f4ef"><title>My Travels — Lakshmikanth</title>
<style>
:root{--paper:#f6f4ef;--ink:#20251f;--muted:#697168;--green:#426b50;--line:#e4e3da}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1100px,calc(100% - 36px));margin:auto}header{padding:24px 0;border-bottom:1px solid var(--line)}a{color:inherit}.back{color:var(--green);text-decoration:none;font-weight:650}.intro{padding:55px 0 28px}.eyebrow{color:var(--green);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700}h1{font-size:clamp(2.6rem,7vw,5rem);letter-spacing:-.07em;line-height:1;margin:12px 0 14px}.intro p{max-width:620px;color:var(--muted);font-size:1.02rem}.grid{columns:3 260px;column-gap:16px;padding:20px 0 70px}.photo{break-inside:avoid;margin:0 0 16px;overflow:hidden;border-radius:16px;background:#e8e5dc;box-shadow:0 8px 24px #20251f12;cursor:pointer}.photo img{display:block;width:100%;height:auto;transition:transform .35s}.photo:hover img{transform:scale(1.025)}.photo figcaption{padding:10px 13px;color:var(--muted);font-size:.82rem}.lightbox{position:fixed;inset:0;background:#101510ed;display:none;align-items:center;justify-content:center;padding:24px;z-index:10}.lightbox.open{display:flex}.lightbox img{max-width:min(100%,1100px);max-height:90vh;object-fit:contain}.close{position:absolute;top:18px;right:22px;color:white;font-size:2rem;border:0;background:none;cursor:pointer}footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:.82rem}@media(max-width:600px){.grid{columns:2 150px;column-gap:10px}.photo{margin-bottom:10px}.photo figcaption{font-size:.74rem;padding:8px}}
</style></head><body><header><div class="wrap"><a class="back" href="../">← Back to my website</a></div></header><main class="wrap"><section class="intro"><div class="eyebrow">Travel journal</div><h1>My travels,<br>one story at a time.</h1><p>A collection of moments, landmarks and memories from the places I’ve explored. Every journey leaves a story worth keeping.</p></section><section class="grid" aria-label="Travel photo gallery">

</section></main><div class="lightbox" id="lightbox" onclick="hidePhoto()"><button class="close" aria-label="Close">×</button><img id="large" alt="Enlarged travel photograph"></div><footer><div class="wrap">© <span id="year"></span> Lakshmikanth S S · Travel journal</div></footer><script>document.getElementById('year').textContent=new Date().getFullYear();function showPhoto(el){document.getElementById('large').src=el.querySelector('img').src;document.getElementById('lightbox').classList.add('open')}function hidePhoto(){document.getElementById('lightbox').classList.remove('open')}</script></body></html>
